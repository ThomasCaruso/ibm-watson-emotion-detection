<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watson NLP Emotion Detection</title>
    <link rel="stylesheet" href="/static/style.css">
    <script defer src="/static/mywebscript.js"></script>
</head>
<body>
    <main class="page-shell">
        <section class="app-card">
            <div class="app-badge">IBM AI APPLICATION</div>
            <h1>NLP Emotion Detection</h1>
            <p class="intro">
                Enter a statement to identify its anger, disgust, fear, joy,
                and sadness scores using the Watson NLP emotion model.
            </p>

            <label for="textToAnalyze">Text to analyze</label>
            <textarea
                id="textToAnalyze"
                rows="5"
                placeholder="Example: I am glad this happened"
            ></textarea>

            <button id="analyzeButton" type="button" onclick="RunSentimentAnalysis()">
                Run Emotion Analysis
            </button>

            <section class="result-panel" aria-live="polite">
                <div class="result-label">Result of Emotion Detection</div>
                <div id="system_response">
                    Your emotion analysis will appear here.
                </div>
            </section>
        </section>
    </main>
</body>
</html>
