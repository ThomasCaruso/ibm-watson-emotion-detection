name: Validate IBM Emotion Detection Project

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-generate-evidence:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt Pillow

      - name: Run unit tests
        run: python -m unittest test_emotion_detection.py -v

      - name: Run static analysis verifier
        run: python tools/static_analysis.py

      - name: Generate evidence screenshots
        run: python tools/generate_evidence_images.py

      - name: Commit generated screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          if git diff --cached --quiet; then
            echo "Evidence screenshots are already current."
          else
            git commit -m "Generate project evidence screenshots"
            git push
          fi
